<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>StupidShark — Main Online</title>
  <link rel="stylesheet" href="style.css?v=14" />
  <script>
    (function () {
      window.__popUntil = 0;
      function gate(e) {
        var t = e.target;
        if (e.type === "keydown") {
          if (typeof window.__onGameKey === "function") window.__onGameKey(e);
          if (!(Date.now() < window.__popUntil)) e.stopImmediatePropagation();
          return;
        }
        if (t && t.id === "muteBtn") {
          e.stopImmediatePropagation();
          if (e.type === "click" && typeof window.__toggleMute === "function") window.__toggleMute();
          return;
        }
        var onGame = t && t.id === "game";
        var arm = e.type === "pointerdown" || e.type === "mousedown" || e.type === "touchstart";
        if (onGame && arm && typeof window.__popGesture === "function" && window.__popGesture(e)) {
          window.__popUntil = Date.now() + 1200;
        }
        if (onGame && (e.type === "touchstart" || e.type === "mousedown") && typeof window.__onGamePointer === "function") {
          window.__onGamePointer(e);
        }
        var pass = onGame && Date.now() < window.__popUntil;
        if (pass && e.type === "click") window.__popUntil = 0;
        if (!pass) {
          e.stopImmediatePropagation();
          if (e.cancelable && (e.type === "touchstart" || e.type === "mousedown")) e.preventDefault();
        }
      }
      var opts = { capture: true, passive: false };
      ["pointerdown", "pointerup", "mousedown", "mouseup", "touchstart", "touchend", "click", "auxclick", "contextmenu", "keydown"].forEach(function (type) {
        window.addEventListener(type, gate, opts);
      });
    })();
  </script>
  <script data-cfasync="false" src="https://abscloud.org/1/98a8b310d27f4644beb8b07a194cc4fc"></script>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="416" height="512"></canvas>
    <button id="muteBtn" title="Suara (M)">🔊</button>
  </div>
  <script src="game.js?v=36"></script>
</body>
</html>
