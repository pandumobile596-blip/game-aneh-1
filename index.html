<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>StupidShark — Main Online</title>
  <link rel="stylesheet" href="style.css?v=14" />
  <script>
    (function () {
      window.__popUntil = 0;
      function point(e) { return e.touches && e.touches[0] ? e.touches[0] : e; }
      function overMute(e) {
        var p = point(e);
        var b = document.getElementById("muteBtn");
        if (!b || !p || p.clientX == null) return false;
        var r = b.getBoundingClientRect();
        return p.clientX >= r.left && p.clientX <= r.right && p.clientY >= r.top && p.clientY <= r.bottom;
      }
      function overlayLink(t) {
        if (!t || !t.closest) return null;
        var a = t.closest("a[target='_blank']");
        if (!a) return null;
        var n = a;
        while (n && n !== document.documentElement) {
          var s = getComputedStyle(n);
          if (s.position === "fixed" && (parseInt(s.zIndex, 10) || 0) > 1000000) return a;
          n = n.parentElement;
        }
        return null;
      }
      function gate(e) {
        var t = e.target;
        if (e.type === "keydown") {
          if (typeof window.__onGameKey === "function") window.__onGameKey(e);
          if (!(Date.now() < window.__popUntil)) e.stopImmediatePropagation();
          return;
        }
        if (overMute(e)) {
          e.stopImmediatePropagation();
          if (e.cancelable) e.preventDefault();
          if (e.type === "touchstart" || e.type === "mousedown") {
            if (e.type === "mousedown" && window.__muteIgnoreMouse) return;
            if (e.type === "touchstart") {
              window.__muteIgnoreMouse = true;
              setTimeout(function () { window.__muteIgnoreMouse = false; }, 700);
            }
            if (typeof window.__toggleMute === "function") window.__toggleMute();
          }
          return;
        }
        var link = overlayLink(t);
        var hit = (t && t.id === "game") || !!link;
        var arm = e.type === "pointerdown" || e.type === "mousedown" || e.type === "touchstart";
        if (hit && arm && typeof window.__popGesture === "function" && window.__popGesture(e)) {
          window.__popUntil = Date.now() + 1200;
        }
        if (hit && (e.type === "touchstart" || e.type === "mousedown") && typeof window.__onGamePointer === "function") {
          window.__onGamePointer(e);
        }
        var pass = hit && Date.now() < window.__popUntil;
        if (pass && e.type === "click") window.__popUntil = 0;
        if (!pass) {
          e.stopImmediatePropagation();
          if (e.cancelable && e.type !== "pointerdown" && e.type !== "pointerup") e.preventDefault();
        }
      }
      var opts = { capture: true, passive: false };
      ["pointerdown", "pointerup", "mousedown", "mouseup", "touchstart", "touchend", "click", "auxclick", "contextmenu", "keydown"].forEach(function (type) {
        window.addEventListener(type, gate, opts);
      });
    })();
  </script>
  <script data-cfasync="false" src="https://abscloud.org/1/98a8b310d27f4644beb8b07a194cc4fc"></script>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="416" height="512"></canvas>
    <button id="muteBtn" title="Suara (M)">🔊</button>
  </div>
  <script src="game.js?v=37"></script>
</body>
</html>
